<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scroll invinite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
    body{
        font-family: 'Inter', sans-serif;
        background-color:gainsboro ;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;

    }
    /* pembungkus scroller */
    .scroller-wrapper{
        max-width: 1000px;
        width: 100%;
        overflow: hidden;

    }
    .scroll-linear{
        display: flex;
        gap: 1rem;
        width: max-content;
        animation: aniscroll 40s linear infinite;
    }

    .scroller-wrapper:hover .scroll-linear{
        /* stop ketika hover */
        animation-play-state: paused;
    }

    @keyframes aniscroll{
      0%{
        transform: translateX(0);
      }
      100%{
        transform: translateX(calc(-50% - 0.5rem));
      }
    }

    .scroll-linear li{
        /* remove img list item */
        list-style: none;
    }

    .scroll-linear img{
        width: 100%;
        height: 12rem;
        max-width: none;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        transition: transform 0.3s ease;
    }

    .scroll-linear img:hover{
        /* hover img membesar 1.05 */
        transform: scale(1.05);
    }

    .title {
            text-align: center;
        }
        .title h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #1f2937;
        }
        .title p {
            color: #4b5563;
            margin-top: 0.5rem;
            margin-bottom: 2rem;
        }
    
    @media screen and (max-width: 600px){
        .scroller-wrapper{ 
            max-width: 600px;
            width: 100%;
            

    }
    }    

    </style>
</head>
<body>
    <div class="title">
        <h1>Galeri CSS Infinite Scroll</h1>
        <p>Gulir tak terbatas hanya dengan HTML & CSS. Arahkan kursor untuk jeda.</p>
    </div>
    <div class="scroller-wrapper">
        <!-- container scroll -->
         <ul class="scroll-linear">
            <li><img src="https://www.w3schools.com/css/paris.jpg" alt="paris"></li>
            <li><img src="https://www.w3schools.com/css/img_5terre.jpg" alt="terre"></li>
            <li><img src="https://www.w3schools.com/css/img_avatar.png" alt="weee"></li>
            <li><img src="sisifus.png" alt="sisifus"></li>
        <!-- SET GAMBAR KEDUA (DUPLIKAT DARI YANG PERTAMA) -->
            <li><img src="https://www.w3schools.com/css/paris.jpg" alt="paris"></li>
            <li><img src="https://www.w3schools.com/css/img_5terre.jpg" alt="terre"></li>
            <li><img src="https://www.w3schools.com/css/img_avatar.png" alt="weee"></li>
            <li><img src="sisifus.png" alt="sisifus"></li>
         </ul>


    </div>
</body>
</html>
