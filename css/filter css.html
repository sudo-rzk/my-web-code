<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Css</title>
    <style>
        /* 
        brightnest:num|%
        saturation:num|%
        grayscale:num|%
        hue:num|%
        hue-rotate:deg
        blur: num|px
        contrast:num|%
        invert:num|%
        opacity:num|%
        sepia:num|%
        drop-shadow:sma seperti box-shadow 

        */
        body{
            text-align: center;
        }
        #foto1{
           filter: blur(3px);
        }
        #foto2{
            /* default:1 == 100% | 0 dark */
            filter: brightness(1.3);
        }
        #foto3{
            /* kekuningan | 0 grayscale */
            filter: sepia(120%);
        }
        #foto4{
            filter: hue-rotate(-640deg);
        }
        #foto5{
            /* default 100% | 0 normal */
            filter: invert(140%);
        }
        #foto6:hover{
           filter: drop-shadow(5px 5px 5px black);
        }
        center{
            filter: drop-shadow(5px 5px 5px rgba(0, 4, 255, 0.574));
            font-size: 150px;
            color: azure;
        }
        #foto7{
            filter:blur(10px) drop-shadow(5px 5px 5px black);
            transition: 1s;
        }
        #foto7:hover{
            filter: blur(0) ;
    
        }
    </style>
</head>
<body>
    <img id="foto1"  src="wallpaper-ironman.jpg" alt="ironman">
    <img  id="foto2" src="wallpaper-ironman.jpg" alt="ironman" width="350px">
    <img  id="foto3" src="wallpaper-ironman.jpg" alt="ironman" width="350px">
    <img  id="foto4" src="wallpaper-ironman.jpg" alt="ironman" width="350px">
    <img  id="foto5" src="weee.jpg" alt="ironman" width="350px">
    <img  id="foto6" src="weee.jpg" alt="ironman" width="350px">
    <img  id="foto7" src="weee.jpg" alt="ironman" width="350px">
    <center>filter</center>
</body>
</html>
