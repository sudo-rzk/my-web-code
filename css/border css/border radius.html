<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border radius </title>
    <style>
        .radius1{
            /* nilai bisa 4 */
            border-radius: 25px;
            background-color: darkgreen;
            padding: 20px;
            width: 120px;
            height: 120px;
        }
        .radius2{
            border-radius: 25px;
            border: 2px solid darkcyan;
            padding: 20px;
            width: 120px;
            height: 120px;
        }
        .radius3 img{
            border-radius: 25px;
            border: 2px solid lawngreen;
            padding: 20px;
            width: 120px;
            height: 120px;
        }
        .radius4{
            border-radius: 50%;
            width: 100px;
            height: 100px;
            padding: 20px;
            background-color: darkorchid;
            text-align: center;
            
        }
        .radius5{
            /* 50px: sumbu x 20px:sumbu y */
            border-radius: 50px / 20px;
            width: 100px;
            height: 100px;
            padding: 12px;
            background-color: gold;
        }
    </style>
</head>
<body>
    <h2>border radius property</h2>
    <p class="radius1">rounded corners</p>
    <p class="radius2">border line color</p>
    <div class="radius3">
        <img src="ganjar-wong-saya-suka-kok.gif" alt="yaelahhh">
    </div>
    <p class="radius4">rounded perfect</p>
    <p class="radius5">oval</p>
</body>
</html>
