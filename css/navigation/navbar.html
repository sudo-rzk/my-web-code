<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
    <style>
        *,html,body{
            margin:0;
            padding: 0;
            font-family:sans-serif;
        }
        /* mengatur ukuran dan warna background 1layar */
        .fcontainer{
            width: 800px;
            height: 100vh;
            background-color: cadetblue;
        }
        .wrapped{
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            padding: 15px;
            width: 100%;
            height: 80px;
            background-color: darkslategrey;
        }
        .brand{
            display: flex;
            flex-direction: row;
            font-size: x-large;
            padding: 15px;
            text-transform: capitalize;
        }
        .fname{
          color: azure;
          font-weight: 700;
        }
        .lname{
            color:crimson;
            font-weight: 400;
            padding-left: 4px;
        }
        .nav{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .nav.li{
            list-style-type: none;
            padding: 15px;
        }
        .nav >li>a{
            text-decoration: none;
            font-size: x-large;
            padding: 15px;
            text-transform: capitalize;
        }

    </style>
</head>
<body>
    <div class="fcontainer">
        <nav class="wrapped">
            <div class="brand">
                <div class="fname">hidden</div>
                <div class="lname">crypt</div>
            </div>
            <ul class="nav">
                <li><a href="#">Home</a></li>
                <li><a href="#">content</a></li>
                <li><a href="#">contact</a></li>
            </ul>
        </nav>
    </div>

    
</body>
</html>
