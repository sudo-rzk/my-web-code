<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <style>
        body{
            text-align: center;
        }
        .tooltip{
            position: relative;
            display: inline-block;
            border-bottom: 2px solid green;
        }
        .tooltip-text{
            /* sembunyikan text */
            visibility: hidden;
            width: 120px;
            background-color: black;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s;
            bottom: 100%;
            left: -30px;
        }
        .tooltip:hover .tooltip-text{
            /* tampilkan text */
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <h2>Tooltip animation opacity</h2>
    <div class="tooltip">Hover me
        <span class="tooltip-text">Hello World</span>
    </div>
</body>
</html>
