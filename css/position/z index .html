<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z index</title>
    <style>
/* z-index:menentukan urutan stacking context(tumpukan elemen) ketika beberapa elemen saling tumpang tindih
Nilai: z-index menerima nilai numerik. Semakin besar nilai z-index suatu elemen, 
maka elemen tersebut akan berada di lapisan paling atas.*/
        div{
            width: 200px;
            height: 200px;
            position: absolute;
            margin-left: auto;
        }
        .kotak1{
            background-color: hwb(240 0% 0% / 0.72);
            top: 150px;
            left: 150px;
            z-index: -1;
        }
        .kotak2{
            background-color: hwb(90 0% 0% / 0.753);
            top: 120px;
            left: 120px;
            z-index: 1;
        }
        .kotak3{
            background-color: hsla(355, 83%, 47%, 0.681);
            top: 100px;
            left: 100px;
            z-index: 2;
        }
        /*container position  */
        .container {
  position: relative; /* Membuat container menjadi stacking context */
  border: 2px solid salmon;
}

.box1 {
  position: absolute;
  top: 50px;
  left: 50px;
  background-color: blue;
  width: 71px;
  height: 71px;
  padding: 8px;
}

.box2{
  position:absolute;
  top: 50px;
  left: 50px;
  background-color: hsla(83, 100%, 50%, 0.442);
  width: 71px;
  height: 71px;

}
    </style>
</head>
<body>
    
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>

    <div class="container">
      <div class="box1">Kotak 1</div>
      <div class="box2">Kotak 2</div>
    </div>
    
   
</body>
</html>
