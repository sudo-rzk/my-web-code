<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Css</title>
    <style>
        /* animation:membuat animasi pada elemen bergerak, berubah ukuran, memudar,melakukan transformasi tanpa perlu menggunakan JS
        Komponen:
            @keyframes:aturan menentukan urutan animasi
               form atau 0%:awal animasi
               to atau 100%:akhir animasi
               bisa menentukan rentang animasi pake presen
        Properti animasi:
             animation-name:menentukan nama animasi dipake bersama @keyframe
             animation-duration:menentukan durasi seconds miliseconds
             animation-timin-func:kurva animasi(linear,ease,ease-in,ease-out) 
             animation-delay:penundaan sebelum mulai
             animation-iter-count:berapa kali animasi(number,infinite)
             animation-direction:arah animasi(normal,reverse,alternate:maju mundur)      */
    .div1{
        width: 100px;
        height: 100px;
        font-size: large;
        font-family: monospace;
        color: aliceblue;
        padding: 20px;
        background-color: darkcyan;
        /* nama animasi */
        animation-name: animasi_warna;
        animation-duration: 5s;
        animation-iteration-count: infinite;
    }
    @keyframes animasi_warna{
        /* awal berubah dark blue lalu darkgreen */
        from{background-color: darkblue;}
        to{background-color: darkgreen;}

    }
    .div2{
        width: 100px;
        height: 100px;
        font-size: large;
        font-family: monospace;
        padding: 20px;
        color: aliceblue;
        background-color: darkslateblue;
        animation-name: animation_translate;
        animation-duration: 3s;
        animation-iteration-count: infinite;
        animation-direction: alternate;
    }
    @keyframes animation_translate{
        from{transform: translateX(0);}
        to{transform: translateX(200px);}
    }
    .div3{
        width: 100px;
        height: 100px;
        font-size: large;
        font-family: monospace;
        padding: 20px;
        color: aliceblue;
        background-color: deepskyblue;
        animation-name: animasi_transform;
        animation-duration: 4s;
        animation-iteration-count: infinite;
        
    }
    @keyframes animasi_transform{
        0%{transform:  translateX(0) rotate(0deg) scale(1);
           background-color: blue;}
    
        20%{transform: translateX(200px) rotate(180deg) scale(1.5);
        background-color: green;}
        50%{transform: skew(12deg);
        background-color: yellow;}
        100%{transform: translateX(0) rotate(360deg) scale(1);
        background-color: red;}
    }

    .div4{
        width: 100px;
        height: 100px;
        padding: 20px;
        background-color: ivory;
    }
    #p1{
        font-size: large;
        font-family: monospace;
        color: aliceblue;
        animation-name: colorteks;
        animation-duration: 6s;
        animation-iteration-count: infinite;
    }
    @keyframes colorteks{
    0% {
        color: red;
    }
    66% {
        color: green;
    }
    100% {

        color: blue;
    }
    }

    .div5{
        width: 100px;
        height: 100px;
        padding: 20px;
        background-color: antiquewhite;
    }
    #p2{
        font-size: large;
        font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        color: aqua;
        animation-name: opacityteks;
        animation-duration: 5s;
        animation-iteration-count: infinite;
        animation-direction: alternate;
    }
    @keyframes opacityteks{
        0% {
            color: aquamarine;
            opacity: 0;
            /* ukuran kecil */
            transform: scale(0.4);
        }
        100%{
            color:magenta;
            opacity: 1;
            /* ukuran normal */
            transform: scale(1);
        }
    }

    .box1{
        width: 100px;
        height: 100px;
        background-color: blueviolet;
        position: relative;
        animation-name: box;
        animation-duration:5s ;
        animation-direction: reverse;
    }
    @keyframes box{
        0%{background-color: antiquewhite;left: 0px;top: 0px;}
        25%{background-color: aquamarine;left:50px;top:50px;}
        50%{background-color: blueviolet;left:100px;top:100px;}
        75%{background-color: aquamarine;left:150px;top:150px;}
        100%{background-color: antiquewhite;left:200px;top:200px;}
    }
    </style>
</head>
<body>
    <h2>The @keyframes Rule</h2>
    <div class="div1">animation color</div>
    <br>
    <div class="div2">animation translate</div>
    <br>
    <div class="div3">animation transform</div>
    <br>
    <div class="div4"><p id="p1">animation color text</p></div>
    <br>
    <div class="div5"><p id="p2">animation opacity text</p></div>
    <br>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="curve">
        <div id="ease"></div>
        <div id="linear"></div>
        <div id="ease-in"></div>
        <div id="ease-out"></div>
        <div id="ease-in-out"></div>
        <div id="cubic-bazier"></div>
    </div>
    <div id="fill-mode"></div>
    <div id="shorthand"></div>
</body>
</html>
