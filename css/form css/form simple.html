<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple form</title>
    <style>
        body{
            background-color:ghostwhite;
        }
        div{
          background-color: hsla(271, 76%, 53%, 0.531); 
          box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.573); 
          border-radius: 5px;
          padding: 20px;
          margin: auto;
          margin-bottom: 25px;
          width:25%;
        }
        /* label judul display block sejajar ke bawah */
        label{
          display: block;
          /* atur jarak antar label */
          margin-bottom:5px ;
        }
        .input,select{
            width: 85%;
            padding: 14px 20px;
            margin: 8px 0;
            display: inline-block;
            border: solid 1px #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            border: none;
        }
        .submit{
            background-color: #4CAF50;
            color: aliceblue;
            width: 85%;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px ;
            cursor: pointer;
        }
        .submit:hover{
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <h2>simple form css html</h2>
    <div>
        <form action="">
            <!-- membuat label dan inputan nama -->
            <label for="name">Name</label>
            <input type="text" class="input" name="name" placeholder="Your name">
            <!--membuaat label untuk inputan email-->
            <label for="email">E-mail</label>
            <input type="email" class="input" name="email" placeholder="Your email">
            <!-- membuat dropdown country -->
            <label for="country" class="select">Country</label>
            <select id="country" name="country">
                <option value="indonesia">indonesia</option>
                <option value="US">United States</option>
                <option value="Russian">Russian</option>
            </select>
            <!-- membuat sumbmit -->
           <input class="submit" type="submit" value="submit">
        </form>
    </div>
</body>
</html>
