<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Prefix</title>
    <style>
    /* vendor prefix:awalan di properti css untuk properti yg belum support di browser tertemtu
    -webkit-: Digunakan oleh browser berbasis WebKit (seperti Safari dan Chrome).
    -moz-: Digunakan oleh browser berbasis Mozilla (seperti Firefox).
    -o-: Digunakan oleh versi lama Opera.
    -ms-: Digunakan oleh Internet Explorer dan Microsoft Edge (sebelum Chromium)
    Namun, karena sebagian besar fitur CSS modern sekarang didukung tanpa prefiks,
     Anda tidak perlu terlalu sering menggunakannya

     visit web: shouldiprefix
        
        */
        body{
            text-align: center;
        }
        img{
            -webkit-filter: grayscale(100%);
            filter: grayscale(100%);
            
        }
    </style>
</head>
<body>
    <img src="wallpaper-ironman.jpg" alt="ironman" width="520px">
</body>
</html>
