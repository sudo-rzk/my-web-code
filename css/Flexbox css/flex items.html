<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex items</title>
    <style>
        .order{
            display: flex;
            background-color: darkcyan;
            align-items: stretch;
        }
        .order>.item{
            background-color: lightblue;
            font-size: larger;
            text-align: center;
            line-height: 75px;
            width: 100px;
            margin: 10px;
        }

        .grow{
            display: flex;
            background-color: darkturquoise;
            align-items: stretch;
            flex-wrap: wrap;
        }
        .grow>.items{
            background-color: lightgreen;
            font-size: larger;
            text-align: center;
            line-height: 75px;
            margin: 10px;
            width: 100px;
        }

        .shrink{
            display: flex;
            background-color: darkturquoise;
            align-items: stretch;
        }
        .shrink>.itm{
            background-color: aliceblue;
            font-size: larger;
            text-align: center;
            line-height: 75px;
            margin: 10px;
            width: 100px;
        }

        .basis{
            display: flex;
            background-color: darkturquoise;
            flex-wrap: wrap;
            align-items: stretch;
        }
        .basis>.itms{
            background-color: aliceblue;
            font-size: larger;
            text-align: center;
            line-height: 75px;
            margin: 10px;
            width: 100px;
        }

        .self{
            display: flex;
            background-color:white;
            flex-wrap: wrap;
            align-items: stretch;
            height: 200px;
        }
        .self>.item2{
            font-size: larger;
            background-color: aliceblue;
            text-align: center;
            width: 100px;
            margin: 10px;
            line-height: 75px;
        }
    </style>
</head>
<body>
    <h2>order property</h2>
    <div class="order">
        <!-- menentukan urutan item -->
        <div class="item" style="order: 3;">1</div>
        <div class="item" style="order: 5;">2</div>
        <div class="item" style="order: 1;">3</div>
        <div class="item" style="order: 2;">4</div>
        <div class="item" style="order: 4;">5</div>
    </div>
     <h2>flex grow </h2>
    <div class="grow">
        <!-- menentukan seberapa besar item,membesar kali lipat ukuran item  -->
        <div class="items" style="flex-grow: 3;">1</div>
        <div class="items" >2</div>
        <div class="items" style="flex-grow: 2;">3</div>
        <div class="items" >4</div>
        <div class="items" style="flex-grow: 4;">5</div>
    </div>
    <h2>flex-shrink </h2>
    <div class="shrink">
        <!-- menentukan seberapa menyusut item,work no wrap -->
        <div class="itm">1</div>
        <div class="itm" style="flex-shrink: 3;">2</div>
        <div class="itm" style="flex-shrink: 0;">3</div>
        <div class="itm" style="flex-shrink: 2;">4</div>
        <div class="itm" style="flex-shrink: 3;">5</div>
    </div>
    <h2>flex-basis</h2>
    <div class="basis">
        <!-- menentukan ukuran awal item,tidak terpengruh style lain-->
        <div class="itms">1</div>
        <div class="itms">2</div>
        <div class="itms" style="flex-basis:200px;">3</div>
        <div class="itms">4</div>
        <div class="itms" style="flex-basis:300px;">5</div>
    </div>
    <h2>align self</h2>
    <div class="self">
        <!-- menentukan posisi item sendiri  -->
        <div class="item2">1</div>
        <div class="item2" style="align-self: flex-start;">2</div>
        <div class="item2" style="align-self: center;">3</div>
        <div class="item2" style="align-self: flex-end;">4</div>
        <div class="item2">5</div>
    </div>
</body>
</html>
