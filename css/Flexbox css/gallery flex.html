<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Flexbox</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .header{
            text-align: center;
            padding: 32px;
        }
        .row{
            display: flex;
            flex-wrap: wrap;
            padding:0 4px;
        }
        .column{
            flex: 25%;
            max-width: 25%;
            padding:  4px;
        }
        .column img{
            margin-top:8px ;
            vertical-align: middle;
        }
        @media (max-width:800px) {
            .column{
                flex: 50%;
                max-width: 50%;
            }
        }
        @media(max-width:600px){
          .column{
            flex: 100%;
            max-width: 100%;
          }
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Gallery Flexbox </h2>
    </div>
    <div class="row">
        <div class="column">
            <img src="https://www.w3schools.com/w3images/ocean.jpg" alt="ocean" style="width: 100%;">
            <img src="https://www.w3schools.com/w3images/paris.jpg" alt="paris" style="width: 100%;">
            <img src="https://www.w3schools.com/w3images/rocks.jpg" alt="rocks" style="width: 100%;">
            <img src="https://www.w3schools.com/w3images/paris.jpg" alt="paris" style="width: 100%;">
            <img src="https://www.w3schools.com/w3images/nature.jpg" alt="nature" style="width: 100%;">
            <img src="asset/foto-bareng2.jpg" alt="foto-bareng2" style="width: 100%;">
        </div>
        <div class="column">
            <img src="asset/rad.jpg" alt="rad" style="width: 100%;">
            <img src="asset/my sine.jpg" alt="my sine" style="width: 100%;">
            <img src="asset/b&s.jpg" alt="b&s" style="width: 100%;">
            <img src="asset/foto-bareng.jpg" alt="foto-bareng" style="width: 100%;">
        </div>
        <div class="column">
            <img src="asset/timun-mas.jpg" alt="timun-mas" style="width: 100%;">
            <img src="asset/my class.jpg" alt="myclass" style="width: 100%;">
            <img src="asset/trii.jpg" alt="trii" style="width: 100%;">
            <img src="asset/rad.jpg" alt="rad" style="width: 100%;">

        </div>
    </div>
</body>
</html>
