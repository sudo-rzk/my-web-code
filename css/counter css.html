<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter css</title>
<style>
   ol{
    counter-reset: counter-ol ;
   }

   .h2::before{
    counter-increment: counter-ol ;
    content: counter(counter-ol,lower-roman)':';
   }

   div{
    counter-reset: counter-div ; /*bisa start num misal 8 */
   }
   h2::before{
    counter-increment: counter-div; /*atau -5*/
    content:counter(counter-div)':';
   }
 
.div {
  counter-reset: multi-counters;
}

.list::before {
  counter-increment: multi-counters;
  content: counters(multi-counters, ".") ": ";}
 /* "."	|1.1, 1.2, 1.3 ...etc
    ">"	|1>1, 1>2, 1>3 ...etc */
/* ":"	|1:1, 1:2, 1:3 ...etc */

/* default | 1, 2, 3 ...etc
upper-alpha	|A, B, C ...etc
lower-roman	|i, ii, iii ...etc
thai	|๑, ๒, ๓ ...etc 

counter-reset: Digunakan untuk menginisialisasi atau mengatur ulang nilai sebuah counter.
counter-increment: Digunakan untuk menaikkan nilai sebuah counter.
content: Digunakan untuk menampilkan nilai counter pada elemen yang diinginkan.

Alternatif: Jika Anda membutuhkan fleksibilitas yang lebih tinggi,
 Anda dapat menggunakan JavaScript untuk membuat counter.

*/
   
</style>
</head>
<body>
   <ol>
    <h2 class="h2">javascript</h2>
    <h2 class="h2">node js</h2>
    <h2 class="h2">vue js</h2>
    <h2 class="h2">react js</h2>
   </ol>

   <div>
     <h2>boostrap</h2>
     <h2>tailwind</h2>
     <h2>laravel</h2>
     <h2>native</h2>
   </div>

   <div class="div">
    <h2 class="list">html</h2>
    <div class="div">
      <h2 class="list">Vue</h2>
      <h2 class="list">React</h2>
      <h2 class="list">Angular</h2>
    </div>
    <!-- 1: Frameworks
  1.1: Vue
  1.2: React -->
  <!-- 1.3: Angular -->
  </div>
</body>
</html>
