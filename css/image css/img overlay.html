<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image overlay</title>
    <style>
        .container1{
            position: relative;
            width: 360px;
            overflow: hidden;
            float: left;
          
        }
        #foto1{
          width: 360px;
          height: 400px;
          display: block;
    
        }
        .overlay1{
             position: absolute; 
             top:0;
            bottom: 0;
            left: 0;
            right: 0; 
            width: 360px;
            height: 400px;
            opacity: 0;
            /* delay smoot */
            transition: 0.5s ;
            background-color: rgba(38, 128, 0, 0.721);
        }
        .container1:hover .overlay1{
            opacity: 1;
        }
        .txt1{
            position: absolute;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: aliceblue;
            font-size: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            
        }


        .container2{
            position: relative;
            width: 360px;
            float: left;
            margin-left: 8em;
            margin-top: -3.8em;
            max-width: 100%;
            

        }
        #foto2{
            width: 360px;
            height: 400px;
            opacity: 1;
            display: block;
            width: 100%;
            transition: .5s ease;
        }
        .box-txt{
            position: absolute;
            opacity: 0;
            transition:.5s ease;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        .container2:hover #foto2{
            opacity: 0.6;
            border-radius: 25%;
        }
        .container2:hover .box-txt{
            opacity: 1;
            border-radius: 25%;
        }
        .txt2{
            background-color:rgba(35, 100, 0, 0.974);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: aliceblue;
            font-size: 15px;
            padding: 16px 32px;
        }
    </style>
</head>
<body>
    <h2>Fade in Overlay</h2>
    <div class="container1">
        <img src="trii.jpg" alt="trii" id="foto1" >
        <div class="overlay1">
            <span class="txt1">HI,My Name is Trii</span>
        </div>
    </div>
    <!-- <h2>Fade in a Box</h2> -->
    <div class="container2">
        <h2>Fade in a Box</h2>
        <img src="tri2.jpg" alt="tri2" id="foto2">
        <div class="box-txt">
            <span class="txt2">HI,My Name is Trii</span>
        </div>
    </div>
</body>
</html>
