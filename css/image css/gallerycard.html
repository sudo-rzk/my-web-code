<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery card</title>
    <style>
        body{
            background-color:hsla(219, 79%, 66%, 0.902);
        }
        .gallery{
            margin: 15px;
            border-radius: 15px;
            border: none;
            box-shadow:  0px 8px 16px 0px rgba(0, 0, 0, 0.373);
            background-color:ghostwhite;
            /* membuat sejajar kekiri */
            float: left;
            width: 180px;
        }
        .gallery:hover{
            border-radius: 15px;
            box-shadow:  0px 8px 16px 0px rgba(0, 0, 0, 0.490);
              
        }
        .gallery img{
            /* selebar border  */
            width: 100%;
            height: 200px;
            /* top l and top r :radius bottom:0 */
            border-radius: 15px 15px 0 0;
            border-bottom: 1px solid #ccc;     
        }
        div.text{
            font-size: 12px;
            /* font-family: Lucida Sans; */
            font-style: italic;
            text-transform: uppercase;
            padding: 20px;
            text-align: center;
           }


        .gallery-btn{
            margin: 15px;
            border-radius: 15px;
            box-shadow:  0px 8px 16px 0px rgba(0, 0, 0, 0.373);
            background-color:ghostwhite;
            /* membuat sejajar ke kiri */
            float: left;
            width: 180px;
        } 
        .gallery-btn:hover{
          border-radius: 15px;
          box-shadow:  0px 8px 16px 0px rgba(0, 0, 0, 0.490);
        }
        .gallery-btn img{
           /* selebar border  */
          width: 100%;
          height: auto;
          /* top l and top r :radius bottom:0 */
          border-radius: 15px 15px 0 0;
          border-bottom: 1px solid #ccc; }    

          .gallery-btn2{
            margin: 15px;
            border-radius: 15px;
            box-shadow:  0px 8px 16px 0px rgba(0, 0, 0, 0.373);
            background-color:ghostwhite;
            /* membuat sejajar ke kiri */
            float: left;
            width: 180px;
        } 
        .gallery-btn2:hover{
          border-radius: 15px;
          box-shadow:  0px 8px 16px 0px rgba(0, 0, 0, 0.490);
        }
        .gallery-btn2 img{
           /* selebar border  */
          width: 100%;
          height: 220px;
          /* top l and top r :radius bottom:0 */
          border-radius: 15px 15px 0 0;
          border-bottom: 1px solid #ccc; 
        }  
        .btn{
          margin-left: 40px;
          margin-top: 10px;
          margin-bottom: 10px;
          background-color: crimson;
          color: white;
          font-size: 13px;
          font-family: Helvetica;
        }
        .btn:hover{
          box-shadow:  0px 8px 16px 0px rgba(0, 0, 0, 0.590);
          cursor: pointer;
        } 
        
        @media screen and(max-width:600px){
          .gallery{
            max-width: 100%;
            margin: 10px;
            align-content: space-between;
          } 
          
          .gallery-btn{
            align-content: space-between;
            flex-direction: column;
            float: none;
            display: flex;
            flex-wrap: wrap;
            max-width: 100%;
            margin:0;
          } 
          .gallery-btn2{
            flex-direction: column;
            float: none;
            display: flex;
            flex-wrap: wrap;
            max-width: 100%;
            margin:0;
          } 

        }
    </style>
</head>
<body>
    <div class="gallery">
        <!-- link a menjangkau gambar saja text tidak  -->
      <a  href="https://youtube.com/shorts/7IVwq68PYyk?si=yL6Xz3XxX7fMnUDS" target="_blank">
        <img src="ganjar-ampun dije.gif" alt="ampun dije" width="219" height="190">
      </a>
      <div class="text"> ampun dije yaelahhh</div>
    </div>
    <div class="gallery">
      <a href="https://youtube.com/shorts/0OiITQOF8-Y?si=TbZyGZNMdc4TMFjH" target="_blank">
        <img src="ganjar-homelander.gif" alt="ashleyy look at me" height="180">
      </a>
      <div class="text">ashleyy look at meeeeee</div>
    </div>

     
    <div class="gallery-btn">
        <img src="ganjar-wong-saya-suka-kok.gif" alt="ganjar-wong-saya-suka-kok" height="190">
        <a href="https://youtube.com/shorts/YK7ZDqj6vKA?si=e8U_9ZC1mJY1lDTr" target="_blank">
          <button class="btn">click here🔪🔞</button>
        </a>
    </div>
    <div class="gallery-btn2">
      <img src="mas-anies-anies-baswedan.gif" alt="mas manis" height="190">
      <a href="https://youtube.com/shorts/pJNE5kB3rqE?si=0JVv9bAKIWMj6t2v" target="_blank">
        <button class="btn">click here👍</button>
      </a>
    </div>
</body>
</html>
