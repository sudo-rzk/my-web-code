<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>txt shadow</title>
    <style>
/* text-shadow:untuk menambahkan efek bayangan pada teks
syntax:
text-shadow: h-shadow v-shadow blur-radius color;

h-shadow: Jarak bayangan dari teks secara horizontal. Nilai positif akan menggeser bayangan ke kanan, nilai negatif ke kiri.
v-shadow: Jarak bayangan dari teks secara vertikal. Nilai positif akan menggeser bayangan ke bawah, nilai negatif ke atas.
blur-radius: Tingkat kekaburan bayangan. Nilai yang lebih tinggi akan menghasilkan bayangan yang lebih kabur.
color: Warna bayangan. */
h2{text-shadow: 2px 2px 5px gold;}
h1{color: aqua;
    text-shadow: 1px 1px 2px black, 0 0 25px blue, 0 0 5px darkblue;}
h3{text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);}    
    </style>
</head>
<body>
    <div>
        <h2>text shadow</h2>
        <h1>kenyamanan justru membuat manusia menderita</h1>
        <h3>sekarang kita hanya perlu sabar dan berusaha</h3>
    </div>
</body>
</html>
