<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svg</title>
</head>
<body>
<!--SVG (Scalable Vector Graphics) adalah format gambar berbasis vektor yang dapat diintegrasikan 
langsung ke dalam halaman HTML. Artinya, gambar SVG tidak terdiri dari piksel,
 melainkan dari bentuk-bentuk geometris seperti garis, kurva, dan poligon. 
 Hal ini membuat gambar SVG sangat fleksibel dan dapat diperbesar tanpa kehilangan kualitas.  -->
 <h2>menggunakan tag svg atau manual</h2>
    <svg width="200" height="200">
        <circle cx="100" cy="100" r="60" color="yellow">
<!--<svg>: Tag ini adalah wadah utama untuk semua elemen SVG. Atribut width dan height menentukan ukuran canvas SVG.
    <circle>: Tag ini digunakan untuk membuat lingkaran
    cx dan cy: Atribut ini menentukan koordinat pusat lingkaran
      r: Atribut ini menentukan radius lingkaran
     fill: Atribut ini menentukan warna pengisian lingkaran  -->
    </svg>
    <br><br>
    <h2>menggunakan tag img</h2>
    <img src="Dark_Knight poster.svg" alt="batman">
    <img src="pohon contoh.svg" alt="pohon hahahaha" width="380" height="380">
</body>
</html>
