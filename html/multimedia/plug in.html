<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>embed</title>
</head>
<body>
<!--Elemen <object> dan <embed> adalah elemen HTML yang digunakan untuk menyisipkan konten 
     eksternal ke dalam halaman web
    Perbedaan Utama:
  <object>: Lebih fleksibel dan dapat digunakan untuk berbagai jenis konten.
         Elemen ini juga dapat menentukan konten fallback jika sumber daya eksternal gagal dimuat.
   <embed>: Lebih sederhana dan sering digunakan untuk konten langsung seperti audio, video, atau PDF. 
     Atribut:
      data: pada kedua elemen ini digunakan untuk menentukan URL atau lokasi sumber daya 
      eksternal yang ingin ditampilkan
      
    Kenapa <object> dan <embed> Tidak Sering Digunakan Lagi?
    standar html5,keamanan jika sumber tidak terpercaya,js lebih fleksibel-->
     <h2>embed</h2>
    <embed src="yyyy.jpeg">
    <embed width="50%" height="500px" src="video.html">
    <h2>object</h2>
    <object width="50%" height="500px" data="suara dan musik.html"></object>
</body>
</html>
